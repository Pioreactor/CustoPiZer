name: "CustoPiZe"

permissions:
  contents: write

on:
  repository_dispatch:
    types: pioreactor_release
  workflow_dispatch:
    inputs:
      pioreactor_version:
        description: "Pioreactor version"
        required: true
        default: ''
      publish_release:
        description: "Create a GitHub Release and upload assets"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:

    - name: "⬇ Checkout"
      uses: actions/checkout@v4
      with:
        ref: pioreactor

    - name: "🔎 Determine Pioreactor version"
      run: |
        if [[ "${{ github.event_name }}" = "repository_dispatch" && "${{ github.event.action }}" = "pioreactor_release" ]]; then
          PIOREACTOR_VERSION="${{ github.event.client_payload.version }}"
          echo "Version from repository dispatch: $PIOREACTOR_VERSION"
        else
          PIOREACTOR_VERSION="${{ github.event.inputs.pioreactor_version }}"
          echo "Version from workflow dispatch: $PIOREACTOR_VERSION"
        fi
        echo "PIOREACTOR_VERSION=$PIOREACTOR_VERSION" >> $GITHUB_ENV
    - name: "⬇ Checkout Pioreactor assets"
      uses: actions/checkout@v4
      with:
        repository: Pioreactor/pioreactor
        ref: ${{ env.PIOREACTOR_VERSION }}
        path: pioreactor-source
    - name: "🔁 Sync Pioreactor assets"
      run: bash scripts/sync_pioreactor_assets.sh "${{ github.workspace }}/pioreactor-source"
    - name: "⬇ Download Python wheels"
      run: bash scripts/download_python_wheels.sh
    - name: "⬇ Download RPi image"
      id: download_rpi_image
      run: |
        mkdir -p build
        cd build
        wget https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2025-10-02/2025-10-01-raspios-trixie-armhf-lite.img.xz -q -O input.img.xz
        unxz -f input.img.xz
    - name: "📝 Prepare release"
      run: |
        now=$(date +"%Y%m%d%H%M%S")
        published_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        RELEASE_NAME="Pioreactor ${{ env.PIOREACTOR_VERSION }} (build $now)"
        echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
        RELEASE_TAG="${{ env.PIOREACTOR_VERSION }}"
        echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
        echo "RELEASE_PUBLISHED_AT=$published_at" >> $GITHUB_ENV
        
        # release body
        cat <<EOF > ./build/release.md
  
          * Pioreactor ${{ env.PIOREACTOR_VERSION }}

        Created with [CustoPiZer](https://github.com/Pioreactor/CustoPiZer)

        <!-- mark:untested -->
        EOF



    - name: "🏗 Run CustoPiZer LW"
      uses: Pioreactor/CustoPiZer@pioreactor
      with:
        workspace: "${{ github.workspace }}/build"
        scripts:  "${{ github.workspace }}/workspace/scripts"
        config: "${{ github.workspace }}/config.local"
        environment: '{ "PIO_VERSION": "${{ env.PIOREACTOR_VERSION }}", "LEADER": 1, "WORKER": 1, "HEADLESS": 1, "CUSTOPIZER_GIT_COMMIT": "${{ github.sha }}"}'
        custopizer: "main"
    
    - name: "✏ Rename image LW"
      run: |
        IMAGE_LEADER_WORKER="pioreactor_leader_worker.img"
        echo "IMAGE_LEADER_WORKER=$IMAGE_LEADER_WORKER" >> $GITHUB_ENV
        cd build
        mv output.img $IMAGE_LEADER_WORKER

    - name: "📦 Package the image LW"
      id: package-image-lw
      uses: OctoPrint/actions/package-rpi-image@main
      with:
        image_path: "build/${{ env.IMAGE_LEADER_WORKER }}"

    - name: 📨 Export zip name to env LW
      run: |
        IMAGE_LEADER_WORKER_URL=https://github.com/Pioreactor/CustoPiZer/releases/download/${{ env.RELEASE_TAG }}/${{ steps.package-image-lw.outputs.zip_name }}
        echo "IMAGE_LEADER_WORKER_ZIP=${{ steps.package-image-lw.outputs.zip_name }}" >> $GITHUB_ENV
        echo "IMAGE_LEADER_WORKER_SIZE=${{ steps.package-image-lw.outputs.image_size }}" >> $GITHUB_ENV
        echo "IMAGE_LEADER_WORKER_URL=$IMAGE_LEADER_WORKER_URL" >> $GITHUB_ENV
        echo "Link to leader-worker image: $IMAGE_LEADER_WORKER_URL" >> $GITHUB_STEP_SUMMARY
        echo "Leader-worker image size (bytes): ${{ steps.package-image-lw.outputs.image_size }}" >> $GITHUB_STEP_SUMMARY


    - name: "🏗 Run CustoPiZer L"
      uses: Pioreactor/CustoPiZer@pioreactor
      with:
        workspace: "${{ github.workspace }}/build"
        scripts:  "${{ github.workspace }}/workspace/scripts"
        config: "${{ github.workspace }}/config.local"
        environment: '{ "PIO_VERSION": "${{ env.PIOREACTOR_VERSION }}", "LEADER": 1, "WORKER": 0, "HEADLESS": 1, "CUSTOPIZER_GIT_COMMIT": "${{ github.sha }}"}'
        custopizer: "main"

    - name: "✏ Rename image L"
      run: |
        IMAGE_LEADER="pioreactor_leader.img"
        echo "IMAGE_LEADER=$IMAGE_LEADER" >> $GITHUB_ENV
        cd build
        mv output.img $IMAGE_LEADER

    - name: "📦 Package the image L"
      id: package-image-l
      uses: OctoPrint/actions/package-rpi-image@main
      with:
        image_path: "build/${{ env.IMAGE_LEADER }}"

    - name: 📨 Export zip name to env L
      run: |
        IMAGE_LEADER_URL=https://github.com/Pioreactor/CustoPiZer/releases/download/${{ env.RELEASE_TAG }}/${{ steps.package-image-l.outputs.zip_name }}
        echo "IMAGE_LEADER_ZIP=${{ steps.package-image-l.outputs.zip_name }}" >> $GITHUB_ENV
        echo "IMAGE_LEADER_SIZE=${{ steps.package-image-l.outputs.image_size }}" >> $GITHUB_ENV
        echo "IMAGE_LEADER_URL=$IMAGE_LEADER_URL" >> $GITHUB_ENV
        echo "Link to leader image: $IMAGE_LEADER_URL" >> $GITHUB_STEP_SUMMARY
        echo "Leader image size (bytes): ${{ steps.package-image-l.outputs.image_size }}" >> $GITHUB_STEP_SUMMARY



    - name: "🏗 Run CustoPiZer W"
      uses: Pioreactor/CustoPiZer@pioreactor
      with:
        workspace: "${{ github.workspace }}/build"
        scripts:  "${{ github.workspace }}/workspace/scripts"
        config: "${{ github.workspace }}/config.local"
        environment: '{ "PIO_VERSION": "${{ env.PIOREACTOR_VERSION }}", "LEADER": 0, "WORKER": 1, "HEADLESS": 1, "CUSTOPIZER_GIT_COMMIT": "${{ github.sha }}" }'
        custopizer: "main"

    - name: "✏ Rename image W"
      run: |
        IMAGE_WORKER="pioreactor_worker.img"
        echo "IMAGE_WORKER=$IMAGE_WORKER" >> $GITHUB_ENV
        cd build
        mv output.img $IMAGE_WORKER

    - name: "📦 Package the image W"
      id: package-image-w
      uses: OctoPrint/actions/package-rpi-image@main
      with:
        image_path: "build/${{ env.IMAGE_WORKER }}"

    - name: 📨 Export zip name to env W
      run: |
        IMAGE_WORKER_URL=https://github.com/Pioreactor/CustoPiZer/releases/download/${{ env.RELEASE_TAG }}/${{ steps.package-image-w.outputs.zip_name }}
        echo "IMAGE_WORKER_ZIP=${{ steps.package-image-w.outputs.zip_name }}" >> $GITHUB_ENV
        echo "IMAGE_WORKER_SIZE=${{ steps.package-image-w.outputs.image_size }}" >> $GITHUB_ENV
        echo "IMAGE_WORKER_URL=$IMAGE_WORKER_URL" >> $GITHUB_ENV
        echo "Link to worker image: $IMAGE_WORKER_URL" >> $GITHUB_STEP_SUMMARY
        echo "Worker image size (bytes): ${{ steps.package-image-w.outputs.image_size }}" >> $GITHUB_STEP_SUMMARY


    - name: "📝 Write image size metadata"
      run: |
        cat > build/image-sizes.json <<EOF
        {
          "leader_worker": {
            "zip": "${{ env.IMAGE_LEADER_WORKER_ZIP }}",
            "size_bytes": ${{ env.IMAGE_LEADER_WORKER_SIZE }}
          },
          "leader": {
            "zip": "${{ env.IMAGE_LEADER_ZIP }}",
            "size_bytes": ${{ env.IMAGE_LEADER_SIZE }}
          },
          "worker": {
            "zip": "${{ env.IMAGE_WORKER_ZIP }}",
            "size_bytes": ${{ env.IMAGE_WORKER_SIZE }}
          }
        }
        EOF


    - name: "🔖 Create release & attach assets"
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'repository_dispatch' || github.event.inputs.publish_release == 'true'
      with:
        name: "${{ env.RELEASE_NAME }}"
        tag_name: "${{ env.RELEASE_TAG }}"
        body_path: "build/release.md"
        prerelease: ${{ contains(env.PIOREACTOR_VERSION, 'rc') }}
        fail_on_unmatched_files: true
        files: |
          build/${{ env.IMAGE_LEADER_WORKER_ZIP }}
          build/${{ env.IMAGE_LEADER_WORKER }}.md5
          build/${{ env.IMAGE_LEADER_WORKER }}.sha256
          build/${{ env.IMAGE_LEADER_ZIP }}
          build/${{ env.IMAGE_LEADER }}.md5
          build/${{ env.IMAGE_LEADER }}.sha256
          build/${{ env.IMAGE_WORKER_ZIP }}
          build/${{ env.IMAGE_WORKER }}.md5
          build/${{ env.IMAGE_WORKER }}.sha256
          build/image-sizes.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "📝 Write release manifest"
      if: github.event_name == 'repository_dispatch' || github.event.inputs.publish_release == 'true'
      env:
        RELEASE_NAME: ${{ env.RELEASE_NAME }}
        RELEASE_PUBLISHED_AT: ${{ env.RELEASE_PUBLISHED_AT }}
        RELEASE_TAG: ${{ env.RELEASE_TAG }}
        IMAGE_LEADER: ${{ env.IMAGE_LEADER }}
        IMAGE_LEADER_SIZE: ${{ env.IMAGE_LEADER_SIZE }}
        IMAGE_LEADER_ZIP: ${{ env.IMAGE_LEADER_ZIP }}
        IMAGE_LEADER_WORKER: ${{ env.IMAGE_LEADER_WORKER }}
        IMAGE_LEADER_WORKER_SIZE: ${{ env.IMAGE_LEADER_WORKER_SIZE }}
        IMAGE_LEADER_WORKER_ZIP: ${{ env.IMAGE_LEADER_WORKER_ZIP }}
        IMAGE_WORKER: ${{ env.IMAGE_WORKER }}
        IMAGE_WORKER_SIZE: ${{ env.IMAGE_WORKER_SIZE }}
        IMAGE_WORKER_ZIP: ${{ env.IMAGE_WORKER_ZIP }}
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        build_dir = Path("build")
        release_tag = os.environ["RELEASE_TAG"]

        def read_checksum(filename: str) -> str:
            return (build_dir / filename).read_text().split()[0]

        def asset_entry(base_name: str, zip_name: str, extract_size: str) -> dict:
            zip_path = build_dir / zip_name
            return {
                "name": zip_name,
                "browser_download_url": f"https://github.com/Pioreactor/CustoPiZer/releases/download/{release_tag}/{zip_name}",
                "size": zip_path.stat().st_size,
                "extract_size": int(extract_size),
                "extract_sha256": read_checksum(f"{base_name}.sha256"),
            }

        manifest = {
            "tag_name": release_tag,
            "name": os.environ["RELEASE_NAME"],
            "published_at": os.environ["RELEASE_PUBLISHED_AT"],
            "draft": False,
            "prerelease": "rc" in release_tag,
            "assets": [
                asset_entry(
                    os.environ["IMAGE_LEADER_WORKER"],
                    os.environ["IMAGE_LEADER_WORKER_ZIP"],
                    os.environ["IMAGE_LEADER_WORKER_SIZE"],
                ),
                asset_entry(
                    os.environ["IMAGE_WORKER"],
                    os.environ["IMAGE_WORKER_ZIP"],
                    os.environ["IMAGE_WORKER_SIZE"],
                ),
                asset_entry(
                    os.environ["IMAGE_LEADER"],
                    os.environ["IMAGE_LEADER_ZIP"],
                    os.environ["IMAGE_LEADER_SIZE"],
                ),
            ],
        }

        (build_dir / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
        PY

    - name: "🤖 Configure git identity"
      if: github.event_name == 'repository_dispatch' || github.event.inputs.publish_release == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: "🗂 Update os_list and push metadata"
      if: (github.event_name == 'repository_dispatch' || github.event.inputs.publish_release == 'true') && !contains(env.PIOREACTOR_VERSION, 'rc')
      run: |
        make update-pioreactor-os-list RELEASE_MANIFEST=build/release-manifest.json
