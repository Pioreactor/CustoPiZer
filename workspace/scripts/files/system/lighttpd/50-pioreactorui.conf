# Pioreactor web API (leaders):
# - Lighttpd-managed FastCGI spawns /usr/bin/pioreactor-fcgi
# - Serve SPA static assets from packaged path via alias /static/
# - Serve user exports from /run/pioreactor/exports via alias /exports/
# - API endpoints are rewritten to /api.fcgi and handled by the FastCGI app
url.rewrite-once = (
  "^(/static($|/.*))$" => "$1",
  "^(/api/.*)$"        => "/api.fcgi$1",
  "^(/unit_api/.*)$"   => "/api.fcgi$1",
  "^(/mcp/.*)$"        => "/api.fcgi$1",
)
alias.url += (
  "/static/" => "/usr/share/pioreactorui/static/"
)

# Serve generated exports from the ephemeral run directory (leaders)
alias.url += (
  "/exports/" => "/run/pioreactor/exports/"
)
server.error-handler-404 = "/static/index.html"


fastcgi.server += (".fcgi" =>
  ((
    "socket"      => "/run/pioreactor/pioreactor_web.sock",
    "bin-path"    => "/usr/bin/pioreactor-fcgi",
    "check-local" => "disable",
    "max-procs"   => 1
  ))
)
