
url.rewrite-once = (
  "^(/static($|/.*))$" => "$1",
  "^(/api/.*)$"        => "/api.fcgi$1",
  "^(/unit_api/.*)$"   => "/api.fcgi$1",
  "^(/mcp/.*)$"        => "/api.fcgi$1",
)
alias.url += (
  "/static/" => "/usr/share/pioreactorui/static/"
)

# Serve generated exports from the user's DOT_PIOREACTOR directory (leaders)
alias.url += (
  "/exports/" => "/home/pioreactor/.pioreactor/web/exports/"
)
server.error-handler-404 = "/index.html"


fastcgi.server += (".fcgi" =>
  ((
    "socket"      => "/run/pioreactorui.sock",
    "bin-path"    => "/usr/bin/pioreactor-fcgi",
    "check-local" => "disable",
    "max-procs"   => 1
  ))
)
